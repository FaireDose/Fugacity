# Publishes the project website on GitHub Pages from main: a live demo of the workbench
# (built from this commit) and short addresses for the AI-assistant instructions:
#   https://fairedose.github.io/Fugacity/          live workbench
#   https://fairedose.github.io/Fugacity/use.md    instructions for using Fugacity in a chat
#   https://fairedose.github.io/Fugacity/agents.md the rules for assistants and agents
#   https://fairedose.github.io/Fugacity/install   how to install the skill
#   https://fairedose.github.io/Fugacity/skill.zip the skill (contributor-skill.zip too)
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Actions are pinned to commit SHAs; each job gets only the permissions it needs.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html site/install.html _site/
          (cd ai/skills && zip -qr ../../_site/skill.zip fugacity && zip -qr ../../_site/contributor-skill.zip fugacity-contributor)
          cp dist/fugacity.js _site/fugacity.js
          cp ai/instructions/use-fugacity.md _site/use.md
          cp AGENTS.md _site/agents.md
          cp llms.txt _site/llms.txt
          mkdir -p _site/schema && cp docs/schema/*.json _site/schema/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish the site
      id-token: write   # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

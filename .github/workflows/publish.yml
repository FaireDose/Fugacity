# Publishes the package to npm when a GitHub release is published.
# Uses npm trusted publishing: npm checks that the request comes from this
# workflow in FaireDose/Fugacity, so no npm token is stored anywhere.
# Configured on npmjs.com under Packages > fugacity > Settings > Trusted publishing.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public

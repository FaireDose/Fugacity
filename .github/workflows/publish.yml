# Publishes the package to npm and attaches the skill zips when a GitHub release is published.
# npm trusted publishing: npm accepts the upload only from this workflow file in
# FaireDose/CHEPTA, so no npm token is stored anywhere, and it adds a provenance record.
# Configured on npmjs.com under Packages > chepta > Settings > Trusted publishing.
# Staged publishing: the workflow only *stages* the new version; it goes live when the
# maintainer approves it with two-factor authentication on npmjs.com (chepta > Staged
# Packages > Approve). See https://docs.npmjs.com/staged-publishing
# Each job gets only the permissions it needs. Actions are pinned to commit SHAs.
name: Publish to npm

on:
  release:
    types: [published]
  # "Run workflow" button (Actions tab): publishes the version in package.json from main,
  # e.g. to retry a failed upload without making a new release.
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read     # to check out the code
      id-token: write    # for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # staged publishing needs npm 11.15.0 or newer; npm 11 runs on Node 22
      - run: npm install -g npm@11
      - run: npm ci
      # A release must carry the version in package.json, and npm never accepts a version
      # twice: stop early with a clear message instead of an npm error.
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$V" ]; then
            echo "::error::Release $TAG does not match package.json version $V. Bump the version in package.json first (pull request), then make the release."
            exit 1
          fi
          if [ "$(npm view "chepta@$V" version 2>/dev/null)" = "$V" ]; then
            echo "::error::chepta@$V is already on npm. Bump the version in package.json first (pull request), then make the release."
            exit 1
          fi
      # Trusted publishing: npm checks this workflow by OpenID Connect; no token is used, and the version
      # is staged for approval on npmjs.com. Exception, the first upload of a new package name: npm adds a
      # trusted publisher only to a package that exists, so that one upload uses an NPM_TOKEN secret (a
      # granular token with write access, a day's expiry) and is published directly. Delete the secret and
      # the token right after it, then add this workflow as the package's trusted publisher.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is set: first upload with a token. Delete the secret and the token after this run."
            npm publish --provenance --access public
          else
            npm stage publish --provenance --access public
          fi

  skills:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # to attach the skill zips to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Attach the skills to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p skill-zips
          for d in ai/skills/*/; do
            n=$(basename "$d")
            (cd ai/skills && zip -qr "../../skill-zips/$n.zip" "$n")
          done
          gh release upload "$TAG" skill-zips/*.zip --clobber

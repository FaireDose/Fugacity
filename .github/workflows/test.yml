name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Data wanted list is up to date
        run: |
          npm run wanted
          git diff --exit-code docs/DATA_WANTED.md || (echo "Run 'npm run wanted' and commit docs/DATA_WANTED.md" && exit 1)

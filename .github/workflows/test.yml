name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Data wanted list is up to date
        run: |
          npm run wanted
          git diff --exit-code docs/DATA_WANTED.md || (echo "Run 'npm run wanted' and commit docs/DATA_WANTED.md" && exit 1)

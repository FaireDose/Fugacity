name: Data
description: Experimental data for a pair, a new component, a correction or a validation case, prepared with your AI assistant or by hand.
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        The rules for data are in [AGENTS.md](https://github.com/FaireDose/CHEPTA/blob/main/AGENTS.md): open sources only, every number from a source someone opened, cited with its table. A reviewer compares the numbers with the source before anything is merged. Put the pair or component in the title so others see it is taken.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Data for a pair (VLE, azeotrope, excess enthalpy, liquid-liquid)
        - New component
        - Correction (a value or result disagrees with an open source)
        - Validation case (data CHEPTA should be tested against)
        - Review notes
    validations:
      required: true
  - type: dropdown
    id: assistant
    attributes:
      label: Prepared with
      options:
        - ChatGPT
        - Claude
        - Gemini
        - GitHub Copilot
        - Other assistant
        - No assistant
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Contribution package or data
      description: Paste the JSON contribution package your assistant prepared (format in AGENTS.md). Without an assistant, give the system, the conditions, the values with units, the source (citation, DOI, link to the open copy, table or figure) and, for a correction, what CHEPTA gives.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I compared every number with the source myself.
          required: true
        - label: Anyone can read the source for free and legally (open-access article, NIST ThermoML Archive, NIST WebBook, open repository, openly licensed databank or library, or a free book).
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Doubts about the data, other sources you found, how the data should be used (test only or fit), pairs you plan to do next.

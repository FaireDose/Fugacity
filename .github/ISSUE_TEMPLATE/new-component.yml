name: New component or binary pair
description: Ask for a chemical or a pair of chemicals to be added to the databank.
title: "[Data] Add "
labels: ["data", "needs review"]
body:
  - type: markdown
    attributes:
      value: Thank you. Please give sources for every number; a reviewer will check them before anything is merged.
  - type: input
    id: components
    attributes:
      label: Components
      description: Names and CAS numbers.
      placeholder: "1-propanol (71-23-8), water (7732-18-5)"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What do you want to use it for?
      placeholder: "Course exercise on extractive distillation; ternary with water and ethylene glycol."
  - type: textarea
    id: sources
    attributes:
      label: Data sources
      description: Papers, tables or databanks with experimental VLE data or published parameters. Links or full citations.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data (optional)
      description: Paste data points or parameters if you have them (T, P, x, y with units).
      render: text

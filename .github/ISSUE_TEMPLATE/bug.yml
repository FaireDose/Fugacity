name: Bug or interface problem
description: Something does not work or displays wrongly. A wrong number goes in the Data form as a correction.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the setup you used (components, model, pressure) and a screenshot if you can.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "Claude artifact in Chrome / ChatGPT canvas / course web page / Node.js"

name: Validation case
description: Contribute experimental data that Fugacity should be tested against.
title: "[Validation] "
labels: ["validation", "needs review"]
body:
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Ethanol + water + ethylene glycol, isobaric 101.3 kPa"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Full citation and DOI.
    validations:
      required: true
  - type: checkboxes
    id: open
    attributes:
      label: Open source
      options:
        - label: Anyone can read these sources for free (open access, ThermoML Archive, NIST WebBook, open repository, or an openly licensed databank).
          required: true
  - type: textarea
    id: data
    attributes:
      label: Data
      description: Columns with units, for example T/K, P/kPa, x1, y1.
      render: text
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: How should it be used?
      options:
        - As a test only
        - To fit new parameters
        - Not sure
